<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Shop | Teal Castle Co</title>
<meta name="description" content="Shop curated Loungefly, Disney treasures, vintage finds, and collectibles from Teal Castle Co.">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="site-header"></div>
<main>
  <section class="page-hero" data-content-src="/api/content/shop">
    <h1 data-field="heading">The Collection</h1>
    <div data-field="body">
      <p>Carefully selected pieces. Available across our marketplaces — or message us if you see something you love.</p>
    </div>
  </section>
  <section class="shop-section">
    <div class="filters" id="categoryFilters" hidden></div>
    <div class="product-grid" id="itemGrid">
      <p class="note">Loading the collection…</p>
    </div>
  </section>
</main>
<div id="site-footer"></div>
<script src="js/site.js"></script>
<script src="js/content.js"></script>
<script src="js/shop.js"></script>
</body>
</html>
